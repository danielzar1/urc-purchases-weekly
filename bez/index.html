<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Bez Price Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#f3f5f9;--card:#ffffff;--fg:#152033;--muted:#5b6678;--line:#d9dfe9;--navy:#1f3864;--on-navy:#ffffff;--err:#b5470f}
@media (prefers-color-scheme: dark){:root{--bg:#0e1420;--card:#161e2d;--fg:#e7ecf4;--muted:#9aa6b8;--line:#2a3548;--navy:#8fb0e6;--on-navy:#0e1420;--err:#f08a52}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Source Sans 3","Segoe UI",Arial,sans-serif;display:grid;place-items:center;
 padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px 22px;display:grid;gap:16px}
h1{margin:0;font:700 1.8rem/1.1 "Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;color:var(--navy)}
p{margin:0;color:var(--muted)}
label{font:600 .75rem/1.3 "Source Sans 3",Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.row{display:grid;gap:8px}
input{font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
button{font:600 15px "Source Sans 3",Arial,sans-serif;padding:12px 16px;border:0;border-radius:8px;background:var(--navy);color:var(--on-navy);cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
input:focus-visible,button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.msg{min-height:1.4em;color:var(--err);font-size:13px}
.foot{font-size:12px;color:var(--muted)}
</style></head>
<body>
<form class="card" id="f" autocomplete="off">
  <h1>Bez Price Check</h1>
  <p>Supplier price comparison, 01 May to 13 October 2026. Enter the password you were given to open it.</p>
  <div class="row"><label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required></div>
  <button id="go" type="submit">Open</button>
  <div class="msg" id="msg" role="alert" aria-live="polite"></div>
  <div class="foot">Universal Recycling Company. Nothing is sent anywhere: the page is unlocked on this device.</div>
</form>
